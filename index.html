<!DOCTYPE html>
<html lang="en">
<!-- Initial webcam/canvas capture logic inspired by https://gist.github.com/rand0mC0d3r/442ab777ad0bf2c91b6e67f6681a27d0 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Negative Viewer</title>
  <meta name="description" content="Use your phone or laptop camera as a negative scanner: preview the negative inverted, then capture a correctly framed PNG.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-128.png" type="image/png">
  <meta name="theme-color" content="#181a1b">
  <meta name="color-scheme" content="light dark">

  <!-- iOS standalone / home screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NegativeCam">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --fg: #111111;
      --panel: rgba(255, 255, 255, 0.85);
      --btn-bg: #f0f0f0;
      --btn-fg: #111111;
      --btn-border: #888888;
      --btn-active: #dddddd;
      --tools-h: 64px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #181a1b;
        --fg: #eeeeee;
        --panel: rgba(24, 26, 27, 0.85);
        --btn-bg: #222222;
        --btn-fg: #eeeeee;
        --btn-border: #444444;
        --btn-active: #333333;
      }
    }
    :root[data-theme="dark"] {
      --bg: #181a1b;
      --fg: #eeeeee;
      --panel: rgba(24, 26, 27, 0.85);
      --btn-bg: #222222;
      --btn-fg: #eeeeee;
      --btn-border: #444444;
      --btn-active: #333333;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --fg: #111111;
      --panel: rgba(255, 255, 255, 0.85);
      --btn-bg: #f0f0f0;
      --btn-fg: #111111;
      --btn-border: #888888;
      --btn-active: #dddddd;
    }

    html {
      height: 100%;
      background: #000;
      -webkit-text-size-adjust: 100%;
    }
    body {
      height: 100%;
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      overscroll-behavior: none;
    }
    @supports (height: 100dvh) {
      html, body { height: 100dvh; }
    }

    /* The player holds the video. It is sized by flex so the toolbar never
       overlaps the frame - what you see is exactly what gets captured. */
    #player {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    #vid {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #tools {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      background: var(--panel);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(128, 128, 128, 0.35);
    }

    button, select {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-fg);
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      touch-action: manipulation;
    }
    button:hover, select:hover { border-color: var(--fg); }
    button:active, select:active { background: var(--btn-active); }
    button:focus-visible, select:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }
    button[aria-pressed="true"] {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }
    button.icon { font-size: 1.25rem; line-height: 1; padding: 8px 12px; }

    #camera-select {
      max-width: 42vw;
      text-overflow: ellipsis;
    }
    .hidden { display: none !important; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--tools-h) + 16px);
      transform: translateX(-50%);
      max-width: 90vw;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(40, 40, 40, 0.92);
      color: #fff;
      font-size: 0.95rem;
      text-align: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #toast.show { opacity: 1; }

    /* Small status line: stream resolution + capture size */
    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 5;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      #tools { gap: 8px; padding: 8px; }
      button, select { padding: 8px 10px; }
    }
  </style>
</head>

<body>
  <div id="player">
    <video id="vid" autoplay playsinline muted></video>
    <div id="hud" class="hidden" aria-live="off"></div>
  </div>

  <div id="tools">
    <button id="open-cam" class="icon" title="Open WebCam" aria-label="Open webcam">📹</button>
    <button id="switch-camera" class="icon" title="Switch camera" aria-label="Switch camera">🔄</button>
    <select id="camera-select" class="hidden" title="Select camera" aria-label="Select camera"></select>
    <button id="invert-toggle" class="icon" title="Toggle negative/normal" aria-label="Toggle negative" aria-pressed="false">🌓</button>
    <button id="torch-toggle" class="icon hidden" title="Toggle torch" aria-label="Toggle torch" aria-pressed="false">🔦</button>
    <button id="capture" class="icon" title="Capture current frame as image" aria-label="Capture frame">📷</button>
    <button id="toggle-dark" class="icon" title="Toggle dark/light mode" aria-label="Toggle dark mode">🌙</button>
    <button id="install-btn" class="icon hidden" title="Install this app to your device" aria-label="Install app">⬇️</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      const $ = (id) => document.getElementById(id);

      const video = $('vid');
      const tools = $('tools');
      const toast = $('toast');
      const openCamBtn = $('open-cam');
      const switchBtn = $('switch-camera');
      const cameraSelect = $('camera-select');
      const invertBtn = $('invert-toggle');
      const torchBtn = $('torch-toggle');
      const captureBtn = $('capture');
      const darkBtn = $('toggle-dark');
      const installBtn = $('install-btn');
      const hud = $('hud');

      let currentStream = null;
      let deviceList = [];
      let currentDeviceId = null;
      let facingMode = 'environment';
      let isInverted = false;
      let torchOn = false;
      let toastTimer = null;

      const coarsePointer = window.matchMedia('(pointer: coarse)');

      function isMobile() {
        return /Mobi|Android/i.test(navigator.userAgent) || coarsePointer.matches;
      }

      function showToast(msg, duration = 2000) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
      }

      /* ---------------------------------------------------------------
       * Theme
       * ------------------------------------------------------------- */
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

      function effectiveTheme() {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') return saved;
        return prefersDark.matches ? 'dark' : 'light';
      }

      function applyTheme() {
        const theme = effectiveTheme();
        document.documentElement.setAttribute('data-theme', theme);
        darkBtn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
        darkBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        darkBtn.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      }

      darkBtn.addEventListener('click', () => {
        localStorage.setItem('theme', effectiveTheme() === 'dark' ? 'light' : 'dark');
        applyTheme();
      });

      prefersDark.addEventListener('change', () => {
        if (!localStorage.getItem('theme')) applyTheme();
      });

      applyTheme();

      /* ---------------------------------------------------------------
       * Invert
       * ------------------------------------------------------------- */
      invertBtn.addEventListener('click', () => {
        isInverted = !isInverted;
        // CSS filter is supported everywhere; the canvas capture uses the
        // "difference" composite instead (see captureFrame) so that the
        // saved file matches the preview even where canvas filters are
        // unavailable (e.g. iOS Safari).
        video.style.filter = isInverted ? 'invert(100%)' : 'none';
        invertBtn.setAttribute('aria-pressed', isInverted ? 'true' : 'false');
      });

      /* ---------------------------------------------------------------
       * Camera selection
       * ------------------------------------------------------------- */
      async function updateCameraList() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
        let devices;
        try {
          devices = await navigator.mediaDevices.enumerateDevices();
        } catch (err) {
          return;
        }
        deviceList = devices.filter((d) => d.kind === 'videoinput');

        const previous = cameraSelect.value;
        cameraSelect.innerHTML = '';
        deviceList.forEach((device, idx) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          // Labels are only exposed after the user grants camera permission.
          option.text = device.label || 'Camera ' + (idx + 1);
          cameraSelect.appendChild(option);
        });

        const wanted = [currentDeviceId, previous].find((id) => id && deviceList.some((d) => d.deviceId === id));
        if (wanted) cameraSelect.value = wanted;

        // Without permission the labels are empty strings, so we cannot tell
        // the cameras apart - keep the picker hidden until we can.
        const labelled = deviceList.some((d) => d.label);
        cameraSelect.classList.toggle('hidden', deviceList.length < 2 || !labelled);
        switchBtn.classList.toggle('hidden', !(isMobile() || deviceList.length > 1));
      }

      function stopCurrentStream() {
        if (currentStream) {
          currentStream.getTracks().forEach((track) => track.stop());
          currentStream = null;
        }
      }

      // Resolves once the new stream's dimensions are known. videoWidth keeps
      // its old value for a moment after srcObject is swapped, so wait for the
      // fresh metadata event rather than trusting a stale number.
      function waitForMetadata() {
        return new Promise((resolve) => {
          if (video.readyState >= 1 && video.videoWidth) {
            resolve();
            return;
          }
          const finish = () => {
            video.removeEventListener('loadedmetadata', finish);
            clearTimeout(timer);
            resolve();
          };
          const timer = setTimeout(finish, 3000);
          video.addEventListener('loadedmetadata', finish, { once: true });
        });
      }

      // Try each constraint set in turn so a single over-constrained request
      // does not abort the whole thing. The existing stream is only torn
      // down once a replacement is actually in hand, so a failed switch
      // leaves the user looking at a working camera.
      async function startCamera(constraintSets) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('Camera unavailable - needs HTTPS or localhost', 4000);
          return;
        }

        let stream = null;
        let lastError = null;

        for (const constraints of constraintSets) {
          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            break;
          } catch (err) {
            lastError = err;
            if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) break;
          }
        }

        if (!stream) {
          console.error('Camera error:', lastError);
          const message = lastError && lastError.name === 'NotAllowedError'
            ? 'Camera permission denied'
            : 'Could not start camera: ' + ((lastError && lastError.name) || 'unknown error');
          showToast(message, 4000);
          return;
        }

        stopCurrentStream();
        currentStream = stream;
        video.srcObject = stream;

        const track = stream.getVideoTracks()[0];
        if (track) {
          const settings = typeof track.getSettings === 'function' ? track.getSettings() : {};
          if (settings.deviceId) currentDeviceId = settings.deviceId;

          // Only offer the torch if this camera has one.
          let hasTorch = false;
          try {
            const caps = typeof track.getCapabilities === 'function' ? track.getCapabilities() : null;
            hasTorch = !!(caps && caps.torch);
          } catch (err) {
            hasTorch = false;
          }
          torchBtn.classList.toggle('hidden', !hasTorch);
          torchOn = false;
          torchBtn.setAttribute('aria-pressed', 'false');
        }

        await waitForMetadata();
        await video.play().catch(() => {});
        updateHud();

        // Labels only become readable once permission has been granted.
        await updateCameraList();
      }

      const highRes = { width: { ideal: 4096 }, height: { ideal: 2160 } };

      function startWithDevice(deviceId) {
        // Only ever open the camera that was asked for. Falling back to
        // "any camera" here would silently hand the user a different one.
        return startCamera([
          { video: { deviceId: { exact: deviceId }, ...highRes }, audio: false }
        ]);
      }

      function startWithFacing(mode) {
        // facingMode is a soft preference: desktop browsers and some laptops
        // simply ignore it rather than failing, and "any camera" is the
        // sensible last resort.
        return startCamera([
          { video: { facingMode: { ideal: mode }, ...highRes }, audio: false },
          { video: { ...highRes }, audio: false },
          { video: true, audio: false }
        ]);
      }

      function startWithAnyCamera() {
        return startCamera([
          { video: { ...highRes }, audio: false },
          { video: true, audio: false }
        ]);
      }

      function nextDeviceIndex() {
        const index = deviceList.findIndex((d) => d.deviceId === currentDeviceId);
        return (index + 1) % deviceList.length;
      }

      switchBtn.addEventListener('click', async () => {
        // On a phone the front/back cameras are the ones worth switching
        // between, and facingMode is the reliable way to reach them. On
        // desktop facingMode is meaningless, so cycle the enumerated
        // devices instead.
        if (isMobile()) {
          facingMode = facingMode === 'environment' ? 'user' : 'environment';
          await startWithFacing(facingMode);
          return;
        }
        if (deviceList.length > 1) {
          const next = deviceList[nextDeviceIndex()];
          if (next && next.deviceId) await startWithDevice(next.deviceId);
          return;
        }
        showToast('No other camera found', 2000);
      });

      cameraSelect.addEventListener('change', async () => {
        const deviceId = cameraSelect.value;
        if (deviceId) await startWithDevice(deviceId);
      });

      openCamBtn.addEventListener('click', async () => {
        const selected = cameraSelect.value;
        if (selected && !cameraSelect.classList.contains('hidden')) {
          await startWithDevice(selected);
        } else if (isMobile()) {
          await startWithFacing(facingMode);
        } else {
          await startWithAnyCamera();
        }
      });

      if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
        navigator.mediaDevices.addEventListener('devicechange', updateCameraList);
      }
      updateCameraList();

      /* ---------------------------------------------------------------
       * Torch and status HUD
       * ------------------------------------------------------------- */
      // A torch gives even light over a negative, which matters more than
      // resolution for a flat-bed scan. Not every camera has one, so the
      // button only appears when the device actually reports a torch.
      torchBtn.addEventListener('click', async () => {
        const track = currentStream && currentStream.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== 'function') return;
        const caps = track.getCapabilities() || {};
        if (!caps.torch) {
          showToast('This camera has no torch', 2500);
          return;
        }
        try {
          const next = !torchOn;
          await track.applyConstraints({ advanced: [{ torch: next }] });
          torchOn = next;
          torchBtn.setAttribute('aria-pressed', torchOn ? 'true' : 'false');
        } catch (err) {
          showToast('Could not switch the torch', 2500);
        }
      });

      function updateHud() {
        if (!currentStream || !video.videoWidth) {
          hud.classList.add('hidden');
          return;
        }
        const crop = visibleCrop();
        const out = crop ? crop.outW + ' x ' + crop.outH : '';
        hud.textContent = video.videoWidth + ' x ' + video.videoHeight + '  \u2192  ' + out;
        hud.classList.remove('hidden');
      }

      /* ---------------------------------------------------------------
       * Capture
       * ------------------------------------------------------------- */
      // The preview uses object-fit: cover, so the visible area is a
      // centre-crop of the video frame. Capture exactly that crop, at the
      // video's native resolution, so the saved file matches the preview.
      function visibleCrop() {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const rect = video.getBoundingClientRect();
        if (!vw || !vh || rect.width < 1 || rect.height < 1) return null;

        const scale = Math.max(rect.width / vw, rect.height / vh);
        const sw = rect.width / scale;
        const sh = rect.height / scale;
        return {
          sx: (vw - sw) / 2,
          sy: (vh - sh) / 2,
          sw: sw,
          sh: sh,
          outW: Math.max(1, Math.round(sw)),
          outH: Math.max(1, Math.round(sh))
        };
      }

      let captureCounter = 0;

      function timestamp() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, '0');
        return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' +
               p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
      }

      // Two captures in the same second must not produce the same filename,
      // otherwise the second download is silently suffixed by the browser.
      function captureFilename() {
        captureCounter = (captureCounter + 1) % 1000;
        const suffix = String(captureCounter).padStart(3, '0');
        return 'negative-' + timestamp() + '-' + suffix + '.png';
      }

      function captureFrame() {
        const crop = visibleCrop();
        if (!crop) {
          showToast('Start the camera first', 3000);
          return;
        }

        // Work on fresh canvases every time. Reusing one canvas means the
        // PNG encoder can still be reading it while the next capture
        // resizes it.
        //
        // The frame is first copied into a snapshot with a plain
        // source-over draw, which is the same operation the non-inverted
        // capture uses and is reliable everywhere. The inversion is then
        // applied to that static snapshot.
        const snap = document.createElement('canvas');
        snap.width = crop.outW;
        snap.height = crop.outH;
        const sctx = snap.getContext('2d');
        sctx.globalCompositeOperation = 'source-over';
        sctx.drawImage(video, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, crop.outW, crop.outH);

        let out = snap;
        if (isInverted) {
          // invert(100%) is exactly |white - pixel|, which is what the
          // "difference" composite does. Doing it on a static snapshot
          // avoids both the canvas "filter" property (not supported on iOS
          // Safari) and a multi-megabyte getImageData round trip.
          out = document.createElement('canvas');
          out.width = crop.outW;
          out.height = crop.outH;
          const octx = out.getContext('2d');
          octx.fillStyle = '#ffffff';
          octx.fillRect(0, 0, crop.outW, crop.outH);
          octx.globalCompositeOperation = 'difference';
          octx.drawImage(snap, 0, 0);
          octx.globalCompositeOperation = 'source-over';
        }

        const filename = captureFilename();
        let saved = false;

        const saveBlob = (blob) => {
          if (saved) return;
          saved = true;
          if (!blob) {
            showToast('Capture failed', 3000);
            return;
          }
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 20000);
          showToast('Saved ' + filename, 2500);
        };

        // toBlob keeps the pixels out of the JS heap; toDataURL would build
        // a multi-megabyte base64 string and can kill the tab on mobile.
        let gotBlob = false;
        out.toBlob((blob) => { gotBlob = true; saveBlob(blob); }, 'image/png');

        // Some browsers occasionally never call the toBlob callback. If
        // that happens, fall back to a data URL so the capture is never
        // silently lost.
        setTimeout(() => {
          if (gotBlob) return;
          console.warn('toBlob did not call back; falling back to toDataURL');
          try {
            const url = out.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            showToast('Saved ' + filename, 2500);
          } catch (err) {
            showToast('Capture failed', 3000);
          }
        }, 4000);
      }

      captureBtn.addEventListener('click', captureFrame);

      /* ---------------------------------------------------------------
       * PWA install
       * ------------------------------------------------------------- */
      let deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.remove('hidden');
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBtn.classList.add('hidden');
        deferredPrompt = null;
      });

      window.addEventListener('appinstalled', () => {
        installBtn.classList.add('hidden');
        deferredPrompt = null;
      });

      // iOS has no beforeinstallprompt - point the user at Share > Add to
      // Home Screen instead.
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      if (isIOS && !isStandalone && !localStorage.getItem('ios-install-hint')) {
        localStorage.setItem('ios-install-hint', '1');
        setTimeout(() => showToast('Tip: Share > Add to Home Screen to install', 5000), 1500);
      }

      /* ---------------------------------------------------------------
       * Service worker
       * ------------------------------------------------------------- */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Relative path so it works when hosted in a subdirectory.
          navigator.serviceWorker.register('./service-worker.js').catch((err) => {
            console.warn('Service worker registration failed:', err);
          });
        });
      }

      /* ---------------------------------------------------------------
       * Misc UI
       * ------------------------------------------------------------- */
      function measureTools() {
        document.documentElement.style.setProperty('--tools-h', tools.offsetHeight + 'px');
        updateHud();
      }
      measureTools();
      window.addEventListener('resize', measureTools);
      window.addEventListener('orientationchange', () => setTimeout(measureTools, 250));

      // The capture size depends on the preview size, so keep the HUD honest.
      if (window.ResizeObserver) {
        new ResizeObserver(() => updateHud()).observe($('player'));
      }

      // One delegated listener instead of one per button.
      tools.addEventListener('pointerdown', (e) => {
        if (!coarsePointer.matches) return;
        const target = e.target.closest('button, select');
        if (!target || !target.title) return;
        showToast(target.title);
      });
    })();
  </script>
</body>
</html>
